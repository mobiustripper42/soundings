; Soundings — LoRa field-node firmware. One binary, declared sensors (DEC-002).
;
; Layout (CLAUDE.md "Architecture"):
;   src/core   — platform-independent logic, host-testable (sensor math, packet
;                (de)serialization, the run cycle). Compiled into esp32 AND native.
;   src/esp32  — board-specific entry + drivers for the Heltec WiFi LoRa 32 V3.
;   test/      — native unit tests (Unity), the load-bearing tier.
;
; Phase 1.1 skeleton — D5 resolved to PlatformIO (mirrors tinkle). lib_deps for the
; SX1262 radio and the sensor drivers get pinned as those layers come online.

[platformio]
default_envs = node

; The real field node: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262). WiFi off, deep
; sleep — that run cycle lands in Phase 2; this env exists now to prove src/core
; links clean under arduino-esp32.
[env:node]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp32/> +<core/> -<gateway/>
build_flags = -I src/core    ; src/esp32 includes core headers by bare name
; ⚠ PINNED EXACTLY, not ^. A floating radio library can move modem defaults between
; builds, and the symptom of that is a link that stops closing — which reads as a site
; problem, or weather, or a bad antenna, and never as a dependency bump (DEC-010).
lib_deps = jgromes/RadioLib@7.7.1

; The gateway radio: the SECOND Heltec, tethered to bee-grace over USB (DEC-009). Same
; board, different program — it receives LoRa, wraps each packet per
; contracts/serial-framing-v1.md, and writes it to USB; downlinks travel the other way.
; It is deliberately dumb: the decoder lives in exactly one place, and that place is the
; Python parser (DEC-003). Nothing here parses a packet.
[env:gateway]
extends = env:node
; Takes src/esp32's DRIVERS — both programs run on the same board and share one radio
; binding — but not its main.cpp, which is the node's program. The exclusion is the entry
; point only, deliberately: a second copy of the SX1262 driver is a second place for
; DEC-010's modem parameters to drift, and the two ends must agree exactly or the link
; silently does not close.
build_src_filter = +<gateway/> +<core/> +<esp32/> -<esp32/main.cpp>
; src/gateway includes the radio driver by bare name, and a quoted include only searches
; the includer's own directory first — which is src/gateway, not src/esp32.
build_flags = ${env:node.build_flags} -I src/esp32

; Bench builds. Same firmware, 2 dBm instead of 17 (DEC-010): both boards sit ~6 ft apart
; on bee-grace during bring-up, and at full power that close the receiver is saturated —
; decodes fail, and the symptom is indistinguishable from a framing bug or a modem
; mismatch. Separate targets rather than a flag to flip, so a field build cannot pick this
; up by accident and a bench build cannot be left in place by forgetting to revert a line.
;   pio run -e node_bench    -t upload --upload-port /dev/ttyUSB1   # "tank"
;   pio run -e gateway_bench -t upload --upload-port /dev/ttyUSB0   # "home"
[env:node_bench]
extends = env:node
build_flags = ${env:node.build_flags} -D SOUNDINGS_BENCH

[env:gateway_bench]
extends = env:gateway
build_flags = ${env:gateway.build_flags} -D SOUNDINGS_BENCH

; Park — silence a board that cannot be unplugged. Radio to sleep, MCU to deep sleep with
; no wake source; it stays there until something resets it, which flashing does. Both
; boards live permanently cabled to bee-grace (DEC-009), so this is the only way to leave
; one in a state you can describe a week later.
;   pio run -e park -t upload --upload-port /dev/ttyUSB1
[env:park]
extends = env:node
build_src_filter = +<park/> +<core/> +<esp32/> -<esp32/main.cpp> -<gateway/>
build_flags = ${env:node.build_flags} -I src/esp32

; Host test tier. src/core compiles under the SAME language standard as the firmware
; so code that's illegal on-target can't sneak through `pio test`. The node env's
; arduino-esp32 toolchain compiles C++ at gnu++11 (confirmed: `pio run -e node -v`),
; so native is pinned to match exactly — lockstep, not a conservative guess. Re-confirm
; and re-align if the espressif32 platform is bumped to a newer arduino-esp32.
[env:native]
platform = native
build_src_filter = +<core/>
build_flags = -std=gnu++11 -I src/core
test_framework = unity
test_build_src = yes        ; link src/core into the test binary
; ArduinoJson (header-only, host-clean) lets the packet round-trip test load the
; actual contracts/vectors/packet-v1.json rather than transcribe it — the test is
; graded against the real shared fixtures, not a copy. Test-only; never linked into
; src/core, so the firmware core stays platform-independent.
lib_deps = bblanchon/ArduinoJson@^7
