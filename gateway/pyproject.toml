# Soundings gateway — Python decoder/ingestion service.
#
# Dev setup:
#   python3 -m venv gateway/.venv && gateway/.venv/bin/pip install -e gateway[dev]
#   (or: .venv/bin/pip install paho-mqtt pytest)
# Run tests (from gateway/):       .venv/bin/python -m pytest
# Run the sim spine (from gateway/, stack up): .venv/bin/python -m soundings_gateway.spine --realtime

[project]
name = "soundings-gateway"
version = "0.0.1"
description = "Soundings LoRa gateway: decode packets into structured readings."
requires-python = ">=3.10"
# paho-mqtt: MQTT client for the spine. cryptography: Ed25519 for the signed firmware
# manifest (DEC-013) — the daemon verifies, tools/publish_firmware.py signs. The packet
# and framing parsers are still stdlib-only; this dependency is confined to the OTA path.
#
# ⚠ Taken deliberately rather than hand-rolling Ed25519 in Python. The node vendors its
# own verifier because nothing it could link is reachable from the host test tier; here
# there is an audited library one import away, and this is the side that holds the private
# key. A wrong verifier gives a wrong answer that tests catch; a wrong signer leaks a key
# and nothing catches it.
dependencies = ["paho-mqtt>=2", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
